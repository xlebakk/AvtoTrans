<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Портал водителя</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(47,129,247,.07) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(63,185,80,.05) 0%, transparent 60%);
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 48px rgba(0,0,0,.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .logo h1 {
      font-size: 22px;
      font-weight: 800;
      color: #e6edf3;
    }
    .logo p {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 14px;
      color: #e6edf3;
      font: 14px 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #2f81f7; }
    button[type="submit"] {
      width: 100%;
      background: linear-gradient(135deg, #2f81f7, #1a6ed8);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font: 600 15px 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .15s;
    }
    button[type="submit"]:hover { opacity: .9; }
    .error {
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.3);
      color: #f85149;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
    .hint {
      font-size: 11px;
      color: #8b949e;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚛</div>
      <h1>Портал водителя</h1>
      <p>АвтоТранс — внутренняя система</p>
    </div>

    {% if error %}
      <div class="error">Неверный ID или пароль. Обратитесь к диспетчеру.</div>
    {% endif %}

    <form action="/driver/login" method="post">
      <label for="driver_id">ID водителя</label>
      <input id="driver_id" name="driver_id" type="number" min="1" placeholder="Введите ваш номер (1, 2, 3…)" required autofocus>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" placeholder="Пароль, выданный диспетчером" required>

      <button type="submit">Войти в портал →</button>
    </form>

    <p class="hint">Не знаете свой ID или пароль?<br>Обратитесь к диспетчеру или администратору.</p>
  </div>
</body>
</html>
